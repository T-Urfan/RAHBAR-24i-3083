# Abstention probes: questions the corpus cannot answer, in many wordings.
#
# Added on 11 November 2026, AFTER the golden set, because a UI screenshot run answered
# "How do I apply for a hostel room?" (no campus named) with an invented instruction, at
# confidence "low", while the golden wording (q17) was declined. The golden set is kept as
# written before tuning; these probes measure how robust abstention is. Every one must
# return answered_from_context: false. Run:
#   python eval/run_eval.py --api ... --golden eval/abstention_probes.yaml --out ...

questions:
  - id: p01
    type: abstain
    must_abstain: true
    relevant: []
    question: "How do I apply for a hostel room?"

  - id: p02
    type: abstain
    must_abstain: true
    relevant: []
    question: "Is there a girls hostel and how much does it cost per month?"

