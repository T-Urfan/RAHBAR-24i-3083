# kind cluster for ci.yml (e2e-eval) and cd.yml (deploy). Port 80 on the runner reaches
# the ingress-nginx controller, so the smoke test and the eval go THROUGH the Ingress.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 80, protocol: TCP}
