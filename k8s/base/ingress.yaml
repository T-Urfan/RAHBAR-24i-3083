# One host: / to the ui, /api to the api (the UI calls /api/ask on its own origin).
# Enable the controller with: minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar
  namespace: rahbar
  labels: {app.kubernetes.io/part-of: rahbar}
  annotations:
    # generation on a laptop CPU can take a minute; the controller's default is 60 s
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: ui, port: {number: 8080}}
