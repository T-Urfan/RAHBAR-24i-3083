# The indexer is a Job, not part of the api (section 4.2, ADR 0001): one writer, run once
# and again when the documents change. It builds a NEW collection and only then repoints
# rahbar-active, so the api keeps serving the old index until the new one is verified.
#
# The documents are public FAST-NUCES files we may not commit, so an init container fetches
# them (corpus/fetch.py: one request at a time, files already on the volume are reused)
# onto the corpus PVC, and the indexer reads them from there.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: corpus
  namespace: rahbar
  labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
  labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: indexer
      automountServiceAccountToken: false
      # no CHROMA_PORT=tcp://... style variables: Chroma 1.x reads CHROMA_* as its config
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: fetch-corpus
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/corpus/fetch.py", "--dest", "/corpus"]
          volumeMounts:
            - {name: corpus, mountPath: /corpus}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          args: []
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - {name: CORPUS_DIR, value: /corpus}
          volumeMounts:
            - {name: corpus, mountPath: /corpus, readOnly: true}
            # Tesseract and pdfium write temporary page images here
            - {name: tmp, mountPath: /tmp}
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: corpus
          persistentVolumeClaim: {claimName: corpus}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
---
# Weekly re-index with the same image and arguments. Run it now, with no redeploy:
#   kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  schedule: "0 3 * * 0"
  timeZone: Asia/Karachi
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: indexer
          automountServiceAccountToken: false
          # no CHROMA_PORT=tcp://... style variables: Chroma 1.x reads CHROMA_* as its config
          enableServiceLinks: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: fetch-corpus
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              command: ["python", "/app/corpus/fetch.py", "--dest", "/corpus"]
              volumeMounts:
                - {name: corpus, mountPath: /corpus}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              args: []
              envFrom:
                - configMapRef: {name: rahbar-config}
              env:
                - {name: CORPUS_DIR, value: /corpus}
              volumeMounts:
                - {name: corpus, mountPath: /corpus, readOnly: true}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: corpus
              persistentVolumeClaim: {claimName: corpus}
            - name: tmp
              emptyDir: {sizeLimit: 1Gi}
