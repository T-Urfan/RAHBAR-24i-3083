# Redis: the semantic cache (ADR 0003), with an append-only file on a PVC so a restarted
# pod keeps its entries. One replica and the Recreate strategy: a ReadWriteOnce volume can
# only be mounted by one pod, so a rolling update would deadlock.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: rahbar
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: rahbar}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rahbar
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.4.1-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data",
                 "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: data, mountPath: /data}
          startupProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rahbar
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: rahbar}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
