# PLACEHOLDER ONLY. Never list this file in kustomization.yaml: applying it would replace
# the real Secret. Create the real one from the command line (the key never touches a file):
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
