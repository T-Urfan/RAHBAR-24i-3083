apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Apply order is handled by kubectl; the namespace is listed first for readers.
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - networkpolicy.yaml
  - chroma.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - indexer.yaml
  - ingress.yaml
# secret.placeholder.yaml is deliberately NOT listed (see the file).
