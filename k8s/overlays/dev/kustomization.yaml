# minikube on a laptop: images built locally and loaded with `minikube image load`
# (imagePullPolicy: IfNotPresent in base), Ollama on the host, the real corpus.
#   kubectl apply -k k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - {name: rahbar-api, newTag: dev}
  - {name: rahbar-ui, newTag: dev}
  - {name: rahbar-indexer, newTag: dev}
