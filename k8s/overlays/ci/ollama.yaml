# CI only: Ollama in the cluster, serving nomic-embed-text for the indexer and the api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: rahbar
  labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: rahbar}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ollama
          image: ollama/ollama:0.40.16
          imagePullPolicy: IfNotPresent
          env:
            - {name: HOME, value: /tmp/home}
            - {name: OLLAMA_MODELS, value: /models}
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_KEEP_ALIVE, value: "1h"}
          ports:
            - {name: http, containerPort: 11434}
          startupProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: models
          emptyDir: {sizeLimit: 2Gi}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: rahbar
  labels: {app.kubernetes.io/name: ollama, app.kubernetes.io/part-of: rahbar}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ollama}
  ports:
    - {name: http, port: 11434, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ollama}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: indexer}}
      ports:
        - {protocol: TCP, port: 11434}
  egress:
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}   # model download from the Ollama registry
